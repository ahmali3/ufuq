name: Build and test

# Thin wrapper: the real steps live in tools/ci/*.sh so they can change without editing this file.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: geonames-${{ github.run_id }}
          restore-keys: geonames-
      - name: Build and test
        run: bash tools/ci/build.sh
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/
      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-build
          path: out/

  devices:
    name: Android ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "6.0 (API 23) small phone, no Play Services", api: 23, target: default, profile: "Nexus 4", font: "1.0" }
          - { name: "8.0 (API 26) no Play Services", api: 26, target: default, profile: "pixel_2", font: "1.0" }
          - { name: "11 (API 30) no Play Services, large text", api: 30, target: default, profile: "pixel_4", font: "1.3" }
          - { name: "13 (API 33)", api: 33, target: google_apis, profile: "pixel_6", font: "1.0" }
          - { name: "15 (API 35) tablet", api: 35, target: google_apis, profile: "pixel_tablet", font: "1.0" }
          - { name: "16 (API 36)", api: 36, target: google_apis, profile: "pixel_7", font: "1.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/device-tests.sh ${{ matrix.font }} out/api${{ matrix.api }}
      - name: Upload device results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-api${{ matrix.api }}
          path: out/

  publish:
    name: Publish results to the ci-results branch
    needs: [build, devices]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/publish.sh results
        
